<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>pwd</title>
<script src="https://cdn.jsdelivr.net/npm/hash-wasm@4/dist/argon2.umd.min.js"></script>
<link rel="stylesheet" href="https://eloi-menaud.github.io/specimen/style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<style>
@media (max-width: 1000px) {
  html {
    font-size: 18px !important;
    main{ 
        width: 80%;
    }
  }
}
body{
    background-color: white;
}
sub{
    font-size: 1em !important;
}
main{
    display: flex;
    flex-direction: column;
    margin: 0 auto;
    padding-top: 10rem;
    width: 500px;
    gap: 1rem;
}
button{
    margin-top: 1rem;
}

#keycont{
    p{
         color:red;
         font-size: 12px;
         padding-top: 5px;
    }
    input{
        width: 100%;
    }
}
pre{
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
}
</style>
<body>
    <main>    
        <input id="data" type="text" placeholder="data">
        <div id="keycont">
            <input id="key" type="password" placeholder="key">
            <p id="err">&nbsp;</p>
        </div>
        <button id="hash">hash</button>
        <pre id="out"></pre>
    </main>
    <pre>
algo: argon2id({data}{key})<sub>64</sub>[:13] + '1!a'

argon2id:
    salt        salt0000
    parallelism 1
    iterations  3
    memorySize  65536 KiB
    hashLength  32</pre>
    <script>
    document.getElementById('hash').onclick = async () => {
        const key  = document.getElementById('key').value;
        const data = document.getElementById('data').value;
        const err  = document.getElementById('err');
        const out  = document.getElementById('out');
        if (key.length < 7) {
            err.textContent = 'Key must be at least 7 chars long.';
            out.textContent = '';
            return;
        }
        err.innerHTML = '&nbsp;';
    
        const raw = await hashwasm.argon2id({
            password: `${data}${key}`,
            salt: 'salt0000',
            parallelism: 1,
            iterations: 3,
            memorySize: 65536, // KiB
            hashLength: 32,
            outputType: 'binary'
        });
    
        const hash   = Array.from(raw, b => b.toString(16).padStart(2, '0')).join('');
        const hash64 = btoa(String.fromCharCode(...raw));
        const pwd    = hash64.slice(0,13) + '!1a';

        try {
          out.textContent = pwd;
          await navigator.clipboard.writeText(pwd);
          document.getElementById("hash").innerText = "copied ✓"
          setTimeout(() => {
           	document.getElementById("hash").innerText = "pwd"
          }, 1500);
        } catch (err) {
          alert('Failed to copy to clipboard : ' + err);
          return
        }
    };
    </script>
</body>
</html>
